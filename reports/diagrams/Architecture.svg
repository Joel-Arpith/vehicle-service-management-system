<text x="24" y="38" font-size="15" font-weight="700" fill="#1c1917">AutoCare — how a request travels</text>
<text x="24" y="56" font-size="11" fill="#6b6459">Development topology as built. Production would serve the built assets behind (or alongside) the API; that is not set up.</text>
