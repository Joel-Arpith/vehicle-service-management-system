<rect x="318" y="70" width="236" height="244" rx="8" fill="#ffffff" stroke="#b9ad9c" stroke-width="1.3"/>
<rect x="318" y="70" width="236" height="54" rx="8" fill="#8c563e"/><rect x="318" y="110" width="236" height="14" fill="#8c563e"/>
